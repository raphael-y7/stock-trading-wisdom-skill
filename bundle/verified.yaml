  - 加仓
  - 补仓
  - 摊平
  - 风险报酬比
  - 久赌必赢
  - 胜算
  - 睡眠测试
  - 持股只数
  - 单笔上限
  - 保本
  - 杠杆
  - 融资
  - 两融
  also_read:
  - cap.stock-trading-wisdom-skill.critical-point-buy-skill
  - cap.stock-trading-wisdom-skill.return-allocation
  - cap.stock-trading-wisdom-skill.sell-trailing-stop-skill
  card: cards/money-management-skill.md
  frontmatter:
    description: '决定单笔交易下多大注、怎么分仓加仓时使用：问"买多少/几成仓/分几批买/什么时候加仓（position sizing / money management）"，或想补仓摊低成本、自评胜算大想重仓、仓位重到睡不着时。按"胜算>50%才入场＋本金分份（新手6~8份）＋至少1:3风险报酬比＋分层下注纸面利润才加码＋严禁向下摊平＋睡眠测试"输出仓位计划（分几批/每批比例/止损额占总资金比）。融资/两融/杠杆炒股该不该上的问题也由本卡承接（按风险-胜算原则与书中反面案例作答，杠杆不放大大势风险）。不用于：买卖位置（临界点买点/卖点卡）、资产配置战略层（该拿多少钱入市/回报预期）、要求凯利类最优仓位公式（原书只有思想与区间规则，无公式）。

      '
