- capability_id: cap.stock-trading-wisdom-skill.motion-normality-skill
  revision: 1
  status: active
  slug: motion-normality-skill
  title: 股票运动正常性判定
  importance: critical
  importance_rationale: 命中原书关键任务 t02（判定运动是否正常，作者称"把握股票走势最关键的是判断正常运动"）与 t09（危险信号识别与离场，"见到危险信号，不要三心二意"）；阶段0优先级排序第1位，是一切持有决策的基础——缺此卡则"让利润奔跑"与止损纪律失去统一判定口径（verify_units.md U01 全单元 verified）
  one_liner: 四维（走势线/支撑阻力/突破确认/200天线）加量价逐项核对，全过=正常持有安坐，任一破坏=危险信号全部离场、日后可重入
  intents:
  - 判断当前持仓个股走势是否健康、该不该继续持有
  - 区分正常回调与出货危险信号（洗盘还是出货）
  - 持仓异动（放量长上影、暴升回落、跌破支撑/均线）后的离场判定
  - 危险信号离场后的重入观察
  keywords:
  - 正常运动
  - 危险信号
  - 量价关系
  - 走势线
  - 支撑阻力
  - 200天线
  - 洗盘出货
  - normality check
  - danger signal
  - volume-price
  card: cards/motion-normality-skill.md
  frontmatter:
    description: '当用户持有A股个股并问"还能不能拿、要不要卖、走势还正常吗"，或持仓股出现放量长上影、暴升回落、跌破支撑/均线等异动，问"洗盘还是出货"时使用。用四维（走势线/支撑阻力/双肩头肩确认/200天均线）加量价逐项核对判定"正常运动"：全过=持有安坐，任一破坏=危险信号全部离场。不适用于：无图形量价数据只有基本面消息时；问周期阶段定位、指数大市、具体卖点与移动止损设定。Trigger:
      正常运动/危险信号/破位/洗盘出货/还能拿吗；is this a normal pullback / distribution or washout。

      '
