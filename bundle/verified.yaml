    location: 第五章第一节 该卖股票的时候要当机立断（1994-11-02日记）；别让利润变成亏损
  - source_id: src-main-book
    location: 第三章第一节 赚大钱（运动正常按兵不动）；第三章第二节 注意危险信号；第八章第一节 摸索阶段（止损下移教训）
  promotion:
