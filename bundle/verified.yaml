  title: 炒股的智慧：在华尔街炒股为生的体验（第四版）
  author: 陈江挺
  source_pack: 中国社会科学出版社 2016.7，ISBN 978-7-5161-7612-2；EPUB 转写稿 books/chaogu_zhihui/合并转写稿.md
  baseline_tag: '2026-10-23'
entry:
  name: stock-trading-wisdom-skill
  description: '《炒股的智慧》（陈江挺，2016第四版）全书蒸馏：一套以人性与概率为核心的股票交易决策体系。覆盖：股票运动正常性判定（危险信号）、临界点买卖决策、卖点与移动止损、资金管理与仓位、选股三步过滤、大市判定、泡沫识别、周期阶段定位、心理纪律自检、学股阶段自测、合理回报与资产配置、250天线极简系统、基本面快速审视、大户操纵痕迹识别共 14 项能力。适用于辅助 A 股/美股个股与大市的投资分析决策；不用于荐股、预测具体点位或代客下单。Trigger:
    炒股的智慧、陈江挺、临界点、止损、截短亏损让利润奔跑、败而不倒、久赌必赢、股疯/泡沫、大市。'
  core_principles:
  - 败而不倒：保本第一，本金没了游戏结束（快速止损+别一次下注太多）
  - 炒股是艺术不是科学：只能提高获胜概率（>50%），不能消除不确定性
  - 截短亏损，让利润奔跑：一见不对即刻止损，有利润让利润从小跑成大
  - 买卖全在临界点：入场触发价与止损价同时确定，跌回临界点之下即离场
  - 大市不好时，别买任何股票：用指数当一只股票看它的运动阶段
  - 市场从来不会错：出错的只有你自己，一有不对即刻认错
  - 善战者无赫赫之功：分仓对个股风险、轻仓对大市风险，集小胜为大胜
  out_of_scope:
  - 预测具体点位、荐股、代客下单或任何实盘执行
  - 无行情数据（价格/量能/均线）时的纯基本面估值建模
  - 期货、期权等衍生品的策略设计（书中仅以期货经验佐证股票方法）
  - 人生理财哲学咨询（见附录《金钱的反思》，属背景参考）
  stop_conditions:
  - 用户提供的数据不足以支撑判定（如无任何价格/量能信息）时，先询问补齐，不得静默猜值
  - 用户要求保证收益、稳赚或内幕消息时，说明本体系为概率框架并拒绝
  - 分析结论与用户持仓立场冲突时如实输出，不得迎合
