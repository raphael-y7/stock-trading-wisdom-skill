- capability_id: cap.stock-trading-wisdom-skill.sell-trailing-stop-skill
  revision: 1
  status: active
  slug: sell-trailing-stop-skill
  title: 卖点与移动止损体系
  importance: critical
  importance_rationale: 命中原书关键任务t04（选卖点与移动止损）；作者自述"决定何时卖股票较决定何时买股票更为困难"，第四章第二节为全书篇幅最重的实操节；移动止损是"一般不能全时专职炒股人的最常用方法"。缺此卡则"截短亏损让利润奔跑"无执行件，"不赚不卖/卖盈留亏/到价迟疑"三类高频失败（1994-11-02日记：8500美元利润倒亏2000美元）无对策。
  one_liner: 运动正常就不卖；卖点由六招触发，移动止损沿浪谷只上移不下移、跌穿当前一级即全部离场——截短亏损，让利润奔跑。
  intents:
  - 判断持仓个股的卖出时机与卖出价位
  - 设置并逐级上移移动止损/跟踪止损
  - 处理浮盈回吐与利润保护（别让利润变亏损）
  - 识别短期暴升与量增价滞后的兑现时机
  - 决定卖出后的重新买入条件
  keywords:
  - 卖点
  - 何时卖股票
  - 止盈
  - 落袋为安
  - 移动止损
  - 跟踪止损
  - trailing stop
  - 让利润奔跑
  - 截短亏损
  - cut loss short let profit run
  - 浪谷
  - 保本第一
  - 量增价滞
  - 危险信号
  - 卖出决策
  - 重新买入
  also_read:
  - cap.stock-trading-wisdom-skill.motion-normality-skill
  - cap.stock-trading-wisdom-skill.money-management-skill
  - cap.stock-trading-wisdom-skill.psych-discipline
  card: cards/sell-trailing-stop-skill.md
  frontmatter:
    description: '持有个股后决定卖出时机与卖点时使用：问"什么时候卖/要不要止盈/卖点怎么定/怎么保住利润"，或要求"移动止损/跟踪止损（trailing stop）""跌破某价位就走""沿浪谷上移止损"，或遇短期暴涨、放巨量滞涨想兑现时。产出卖出决策（触发依据+卖出价+仓位动作+重入条件），核心是六招卖点与移动止损A→E——截短亏损，让利润奔跑（cut loss short, let
      profit run）。不用于：买入决策与初始止损设定（临界点买点卡）、大市判断、资产配置战略、预测最高价或目标价、分钟级短炒。

      '
    tags:
    - decision
    - trading
    - risk-management
    - sell-execution
