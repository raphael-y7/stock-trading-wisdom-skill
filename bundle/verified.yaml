    gate:
      independent_intent: true
      independent_contract: true
      independent_run: true
      independent_reuse: true
      independent_eval: true
    notes: 阶段1.5三重验证通过（verify_units.md U04：V1来源/V2纸面演练/V3任务增益全过）。五判据——意图独立（卖点与止损上移是独立用户意图）；契约独立（输入持仓+走势结构，输出卖出决策四字段）；可独立运行（六招+移动止损含判停分支自成闭环）；可复用（适用于任何日线级趋势持仓）；可评测（触发条件与止损路径可纸面复算）。B段已记：A股跳空、六招同时触发无优先级（"危险信号优先"为下游约定非原书规则）。A2相邻区分（motion-normality-skill/critical-point-buy-skill/psych-discipline）为初稿，阶段3回填定稿。
- capability_id: cap.stock-trading-wisdom-skill.money-management-skill
  revision: 1
  status: active
  slug: money-management-skill
  title: 资金管理与仓位规则
  importance: critical
  importance_rationale: 命中原书关键任务t05（决定下注规模与分仓/加仓）；资金管理是投机原理"败而不倒"的执行层，作者以硬币例（注额从本金1/1000升到1/2改变游戏性质）、亏50%需赚100%、赌场仅1%~2%优势三重论证"胜率×小注=久赌必赢"。缺此卡则保本落空——一次大注或向下摊平即可出局（利物莫一生破产三次、上海石化45→10美元摊平例）。
  one_liner: 胜算>50%才入场；新手本金分6~8份、至少1:3风险报酬比才投一份、分层下注纸面利润才加码、严禁向下摊平——任何时候不输光。
  intents:
  - 计算单笔交易应投入的资金规模与股数
  - 规划分批建仓与逐级加码序列
  - 评估风险报酬比是否值得开仓
  - 决定持股集中度与仓位动态调节（睡眠测试）
  - 判断能否补仓/摊平
  keywords:
  - 资金管理
  - 仓位
  - 下注
  - 买多少
