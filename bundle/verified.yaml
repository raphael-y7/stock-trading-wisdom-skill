    notes: 阶段1.5 U03 全单元 verified（V1来源/V2纸面演练/V3任务增益全过）。独立意图=入场触发与止损同步决策；独立契约=前峰前谷/支撑阻力/量能输入，输出三价+八要点核对；可独立运行；与卖点/资金管理/选股/250天线卡互不覆盖；阶段0将其列为最可能晋级独立入口的能力之一，五判据全过晋级。
