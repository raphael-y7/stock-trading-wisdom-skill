- capability_id: cap.stock-trading-wisdom-skill.critical-point-buy-skill
  revision: 1
  status: active
  slug: critical-point-buy-skill
  title: 临界点买点决策
  importance: critical
  importance_rationale: 命中原书关键任务 t03（选买点并同步定止损，"买股票的技巧，全在怎样找临界点上"）；阶段0优先级第2位（与t04并列），是纪律的核心执行件；并承接 t15 假跌破操纵痕迹的买点应用；缺此卡则入场决策无统一格式（触发价+止损价+失败判据三价缺一不可）（verify_units.md U03 全单元 verified）
  one_liner: 买点=公众重新评估股价的临界点，入场触发与止损价同时确定；五类买点+八要点+止损≤20%硬顶，跌回临界点之下即离场
  intents:
  - 判断某个图形突破/回调能否买入（升势破前峰、放量破阻力线、回踩支撑、倒头肩破颈线、假跌破弹回）
  - 买入前同步确定止损价与失败判据（跌破何价即离场）
  - 拦截"跌了很多就买""有好消息/专家推荐就买"类入场冲动
  - 升势A/B点两段建仓的路径安排（A点试探、B点补足）
  keywords:
  - 临界点
  - 买点
  - 止损点
  - 突破买入
  - 假跌破
  - 阻力线
  - 支撑线
  - 倒头肩
  - critical point
  - entry point
  card: cards/critical-point-buy-skill.md
  frontmatter:
    description: '当用户问某股"能不能追、买了止损设哪"（放量突破前高/阻力线/颈线、回踩支撑、跌穿支撑又快速收回的假跌破）时使用；也用于拦截"跌了很多就买""有好消息就买"。买点与止损点成对输出：触发价+止损价+失败判据，止损≤20%硬顶。不适用于：只有基本面消息无图形数据时；问买什么股票、下注多大仓位、何时卖出，或只要250日线机械规则。Trigger: 临界点/买点/假突破/假跌破/止损设哪；breakout
      buy / entry point / where to set stop loss。

      '
